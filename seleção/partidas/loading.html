<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando Partida - Aurore Boreale</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #010a13;
            font-family: 'Roboto', sans-serif;
            color: #c8aa6e;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        /* Efeito de Fundo Animado (Simulando fumaça/magia) */
        .background-fx {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #0a1428 0%, #000000 100%);
            z-index: -2;
        }
        .fog-fx {
            position: absolute;
            top: 0; left: 0; width: 200%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.15;
            animation: moveFog 60s linear infinite;
            z-index: -1;
        }

        @keyframes moveFog {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Layout das Equipes */
        .match-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        .team-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }

        /* Cartas dos Jogadores */
        .player-card {
            width: 180px;
            height: 320px;
            background-color: #1e2328;
            border: 2px solid #463714;
            position: relative;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background-size: cover;
            background-position: center;
            transition: box-shadow 0.3s;
        }

        /* Borda brilhante quando atinge 100% */
        .player-card.loaded {
            border-color: #c8aa6e;
            box-shadow: 0 0 20px rgba(200, 170, 110, 0.4);
        }

        /* Feitiços e Runas (Canto superior esquerdo) */
        .spells-container {
            position: absolute;
            top: 10px;
            left: -15px; /* Quebrando a borda estilo LoL */
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 2;
        }

        .spell-icon, .rune-icon {
            width: 35px;
            height: 35px;
            border: 1px solid #c8aa6e;
            background-color: #010a13;
            background-size: cover;
            box-shadow: 0 2px 5px black;
        }

        .rune-icon { border-radius: 50%; }

        /* Porcentagem Individual (Meio da carta) */
        .player-percent {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: #f0e6d2;
            text-shadow: 2px 2px 10px #000, -2px -2px 10px #000;
            z-index: 2;
        }

        /* Informações na base da carta */
        .player-info {
            background: linear-gradient(to top, rgba(1, 10, 19, 1) 40%, rgba(1, 10, 19, 0));
            padding: 40px 10px 15px 10px;
            text-align: center;
            border-top: 1px solid transparent;
        }

        .player-name {
            color: #f0e6d2;
            font-weight: bold;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .champ-name {
            color: #a09b8c;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        /* Centro (VS e Status) */
        .center-status {
            text-align: center;
            margin: 10px 0;
        }

        .vs-text {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            color: #c8aa6e;
            text-shadow: 0 0 20px rgba(200, 170, 110, 0.8);
            margin-bottom: 5px;
        }

        .global-status {
            color: #a09b8c;
            font-size: 1rem;
            letter-spacing: 2px;
            animation: piscar 1.5s infinite alternate;
        }

        @keyframes piscar {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="background-fx"></div>
    <div class="fog-fx"></div>

    <div class="match-container">
        
        <!-- EQUIPE AZUL -->
        <div class="team-row" id="team-blue">
            <!-- As cartas serão geradas pelo JavaScript aqui -->
        </div>

        <!-- CENTRO -->
        <div class="center-status">
            <div class="vs-text">VS</div>
            <div class="global-status" id="global-status">Aguardando jogadores...</div>
        </div>

        <!-- EQUIPE VERMELHA -->
        <div class="team-row" id="team-red">
            <!-- As cartas serão geradas pelo JavaScript aqui -->
        </div>

    </div>

    <script>
        // 1. DADOS DOS JOGADORES (Simulando o que virá do Firebase)
        const jogadores = [
            // Equipe Azul (Time 1)
            { id: 1, nome: "Você", champ: "Litlegot", time: "blue", img: "../seleção/icones/personagens/litlegot.jpg", progress: 0 },
            { id: 2, nome: "Gamer99", champ: "Guerreiro", time: "blue", img: "https://via.placeholder.com/180x320/1e2328/c8aa6e?text=Campeao", progress: 0 },
            { id: 3, nome: "Shadow", champ: "Mago", time: "blue", img: "https://via.placeholder.com/180x320/1e2328/c8aa6e?text=Campeao", progress: 0 },
            { id: 4, nome: "HealerBR", champ: "Suporte", time: "blue", img: "https://via.placeholder.com/180x320/1e2328/c8aa6e?text=Campeao", progress: 0 },
            { id: 5, nome: "Sniper", champ: "Atirador", time: "blue", img: "https://via.placeholder.com/180x320/1e2328/c8aa6e?text=Campeao", progress: 0 },
            
            // Equipe Vermelha (Time 2)
            { id: 6, nome: "Faker", champ: "Assassino", time: "red", img: "https://via.placeholder.com/180x320/3a1010/c8aa6e?text=Inimigo", progress: 0 },
            { id: 7, nome: "T1 Zeus", champ: "Tanque", time: "red", img: "https://via.placeholder.com/180x320/3a1010/c8aa6e?text=Inimigo", progress: 0 },
            { id: 8, nome: "ShowMaker", champ: "Mago", time: "red", img: "https://via.placeholder.com/180x320/3a1010/c8aa6e?text=Inimigo", progress: 0 },
            { id: 9, nome: "Deft", champ: "Atirador", time: "red", img: "https://via.placeholder.com/180x320/3a1010/c8aa6e?text=Inimigo", progress: 0 },
            { id: 10, nome: "Keria", champ: "Suporte", time: "red", img: "https://via.placeholder.com/180x320/3a1010/c8aa6e?text=Inimigo", progress: 0 }
        ];

        // 2. RENDERIZAR AS CARTAS NA TELA
        function renderizarCartas() {
            const teamBlueContainer = document.getElementById('team-blue');
            const teamRedContainer = document.getElementById('team-red');

            jogadores.forEach(jog => {
                const cardHTML = `
                    <div class="player-card" id="card-${jog.id}" style="background-image: url('${jog.img}');">
                        
                        <div class="spells-container">
                            <div class="rune-icon" style="background-image: url('../seleção/icones/runas/exemplo_runa.png');"></div>
                            <div class="spell-icon" style="background-image: url('../seleção/icones/habilidades/flash.png');"></div>
                            <div class="spell-icon" style="background-image: url('../seleção/icones/habilidades/ignite.png');"></div>
                        </div>

                        <div class="player-percent" id="percent-${jog.id}">0%</div>
                        
                        <div class="player-info">
                            <div class="player-name">${jog.nome}</div>
                            <div class="champ-name">${jog.champ}</div>
                        </div>
                    </div>
                `;

                if (jog.time === "blue") {
                    teamBlueContainer.innerHTML += cardHTML;
                } else {
                    teamRedContainer.innerHTML += cardHTML;
                }
            });
        }

        // 3. SIMULAR O CARREGAMENTO INDIVIDUAL
        function iniciarCarregamento() {
            let todosCarregados = false;
            const statusGlobal = document.getElementById('global-status');

            const intervalo = setInterval(() => {
                let jogadoresProntos = 0;

                jogadores.forEach(jog => {
                    if (jog.progress < 100) {
                        // Incrementa aleatoriamente para parecer real (cada PC carrega em uma velocidade)
                        let incremento = Math.floor(Math.random() * 15);
                        jog.progress += incremento;
                        if (jog.progress > 100) jog.progress = 100;
                        
                        // Atualiza o texto na tela
                        const percentElement = document.getElementById(`percent-${jog.id}`);
                        percentElement.innerText = `${jog.progress}%`;

                        // Efeito visual quando chega a 100%
                        if (jog.progress === 100) {
                            document.getElementById(`card-${jog.id}`).classList.add('loaded');
                            percentElement.style.color = '#c8aa6e';
                        }
                    }

                    if (jog.progress === 100) jogadoresProntos++;
                });

                // Atualiza o texto global de status
                if (jogadoresProntos < 5) {
                    statusGlobal.innerText = "Estabelecendo conexão segura...";
                } else if (jogadoresProntos < 10) {
                    statusGlobal.innerText = "Sincronizando topografia do mapa...";
                }

                // Quando os 10 jogadores chegarem a 100%
                if (jogadoresProntos === jogadores.length) {
                    clearInterval(intervalo);
                    statusGlobal.innerText = "A INVOCAR!";
                    statusGlobal.style.color = "#c8aa6e";
                    statusGlobal.style.fontSize = "1.5rem";
                    
                    setTimeout(() => {
                        alert("Partida Iniciada! Redirecionando para o motor gráfico...");
                        // window.location.href = '../partida/jogo3d.html';
                    }, 2000);
                }

            }, 400); // Atualiza a cada 400 milissegundos
        }

        // Executa as funções quando a tela abre
        window.onload = () => {
            renderizarCartas();
            setTimeout(iniciarCarregamento, 1000); // Dá 1 segundo de respiro antes de começar a carregar
        };
    </script>
</body>
</html>
