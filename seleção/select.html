<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleção de Campeões - Aurore Boreale</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Estilos base */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0a0c;
            background-image: radial-gradient(circle at center, #0a1428 0%, #09090b 100%);
            font-family: 'Roboto', sans-serif;
            color: #c8aa6e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            text-align: center;
            color: #f0e6d2;
            text-shadow: 0 0 10px rgba(200, 170, 110, 0.5);
        }

        /* Top Bar: Informações de Fase e Tempo */
        .top-bar {
            width: 100%;
            background: rgba(1, 10, 19, 0.95);
            border-bottom: 2px solid #785a28;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .fase-info { font-size: 1.5rem; letter-spacing: 2px; }
        .tempo { font-size: 2.5rem; font-weight: bold; color: #ff4e50; }

        /* Layout Principal: 3 Colunas */
        .container-principal {
            display: flex;
            width: 100%;
            max-width: 1600px;
            height: calc(100vh - 80px);
            padding: 20px;
            gap: 20px;
        }

        /* Colunas dos Times */
        .time-coluna {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .time-azul .jogador-card { border-left: 4px solid #005a82; }
        .time-vermelho .jogador-card { border-right: 4px solid #820000; text-align: right; }
        
        .jogador-card {
            background: rgba(1, 10, 19, 0.85);
            border: 1px solid #463714;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            height: 120px;
            position: relative;
        }
        .jogador-nome { font-weight: bold; color: #f0e6d2; font-size: 1.1rem; }
        .jogador-funcao { font-size: 0.8rem; color: #a09b8c; }
        .jogador-status { font-size: 0.8rem; font-style: italic; color: #ff9900; }
        
        .campeao-mini {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 50px;
            height: 50px;
            background-size: cover;
            border: 1px solid #785a28;
            border-radius: 50%;
        }
        .time-vermelho .campeao-mini { left: 10px; right: auto; }

        .lista-bans {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            height: 40px;
        }
        .ban-slot {
            width: 40px; height: 40px; border: 1px solid #785a28;
            background-size: cover; filter: grayscale(100%) brightness(0.5);
        }

        /* Centro: Seleção */
        .centro-selecao {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(1, 10, 19, 0.7);
            border: 1px solid #785a28;
            padding: 20px;
            overflow-y: auto;
        }

        /* Grade de Campeões */
        .lista-campeoes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .campeao-icone {
            width: 80px; height: 80px; border: 2px solid #463714;
            cursor: pointer; transition: 0.3s; background-size: cover;
            display: flex; align-items: flex-end; justify-content: center;
        }
        .campeao-icone.banido { filter: grayscale(100%); pointer-events: none; opacity: 0.3; }
        .campeao-icone:hover, .campeao-icone.ativo { border-color: #c8aa6e; transform: translateY(-5px); }
        .campeao-icone span { background: rgba(0,0,0,0.7); width: 100%; text-align: center; font-size: 0.8rem; padding: 2px 0; }

        /* Controles de Seleção (Rota, Confirmar, etc) */
        .controles-acao {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background: #050b14;
            border: 1px solid #463714;
        }
        select, button {
            background: #1e2328; color: #f0e6d2; border: 1px solid #c8aa6e;
            padding: 10px; font-family: 'Cinzel', serif; font-size: 1rem; cursor: pointer;
        }
        button.confirmar { background: linear-gradient(to bottom, #1e2328, #0a0a0c); font-weight: bold; padding: 10px 30px; }
        button.confirmar:hover:not(:disabled) { box-shadow: 0 0 15px rgba(200, 170, 110, 0.8); }
        button:disabled { border-color: #444; color: #666; cursor: not-allowed; }

        /* Detalhes do Campeão */
        .painel-detalhes { display: none; margin-top: 10px; }
        .lore { font-style: italic; color: #a09b8c; margin-bottom: 15px; border-bottom: 1px solid #463714; padding-bottom: 10px; }
        
        .icones-habilidades { display: flex; gap: 10px; margin: 10px 0; justify-content: center; }
        .skill-icone {
            width: 45px; height: 45px; border: 1px solid #463714; background-size: cover;
            cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold;
        }
        .descricao-skill { background: #010a13; border: 1px solid #463714; padding: 10px; min-height: 60px; font-size: 0.9rem; }

        .atributos { display: flex; flex-wrap: wrap; gap: 15px; background: #050b14; padding: 15px; border: 1px solid #463714; justify-content: space-between; margin-top:15px;}
        .atributos p { font-size: 0.85rem; color: #a09b8c; margin-bottom: 5px; }
        .atributos span { color: #f0e6d2; font-weight: bold; }

        /* Runas */
        .menu_runas { display: flex; gap: 15px; justify-content: center; margin-top: 15px; }
        .runa { text-align: center; cursor: pointer; width: 30%; border: 1px solid transparent; padding: 5px; }
        .runa.ativa { border-color: #c8aa6e; background: rgba(200, 170, 110, 0.1); }
        .runa-icone { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #463714; margin: 0 auto 5px auto; background-size: cover; }

        /* Espectador */
        .espectador-box { background: #111; border: 1px dashed #785a28; padding: 10px; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="fase-info" id="status-fase">Aguardando Conexão...</div>
        <div class="tempo" id="tempo-restante">00</div>
    </div>

    <div class="container-principal">
        <!-- ÁREA ESQUERDA: TIME AZUL -->
        <div class="time-coluna time-azul">
            <h3>Time Azul</h3>
            <div class="lista-bans" id="bans-azul"></div>
            <div id="jogadores-azul"></div>
        </div>

        <!-- ÁREA CENTRAL: SELEÇÃO -->
        <div class="centro-selecao">
            <div class="lista-campeoes" id="lista-campeoes"></div>

            <div class="controles-acao">
                <select id="select-rota">
                    <option value="">Selecione sua Rota...</option>
                    <option value="Líder">Líder (Top)</option>
                    <option value="Mid">Mid (Meio)</option>
                    <option value="Suporte de Precisão">Suporte de Precisão</option>
                    <option value="Suporte Cobertura">Suporte Cobertura</option>
                    <option value="Atacante">Atacante (ADC)</option>
                </select>
                <button class="confirmar" id="btn-confirmar" disabled>Confirmar</button>
            </div>

            <div class="painel-detalhes" id="painel-detalhes">
                <h2 id="nome-campeao">Nome</h2>
                <h4 style="color: #a09b8c;" id="classe-campeao">Classe</h4>
                <div class="lore" id="lore-campeao">Lore...</div>
                
                <h3 style="font-size: 1rem; margin-top:10px;">Habilidades</h3>
                <div class="icones-habilidades">
                    <div class="skill-icone" id="icone-p" onmouseover="mostrarSkill('p')">P</div>
                    <div class="skill-icone" id="icone-q" onmouseover="mostrarSkill('q')">Q</div>
                    <div class="skill-icone" id="icone-w" onmouseover="mostrarSkill('w')">W</div>
                    <div class="skill-icone" id="icone-e" onmouseover="mostrarSkill('e')">E</div>
                    <div class="skill-icone" id="icone-r" onmouseover="mostrarSkill('r')">R</div>
                </div>
                <div class="descricao-skill" id="descricao-skill">Passe o mouse sobre uma habilidade...</div>

                <div class="atributos">
                    <div>
                        <p>AD: <span id="attr-ad">0</span></p><p>AP: <span id="attr-ap">0</span></p>
                    </div>
                    <div>
                        <p>DF: <span id="attr-df">0</span></p><p>DM: <span id="attr-dm">0</span></p><p>Vida: <span id="attr-vm">0</span></p>
                    </div>
                    <div>
                        <p>VdA: <span id="attr-vda">0</span></p><p>VdM: <span id="attr-vdm">0</span></p><p>AH: <span id="attr-ah">0</span></p>
                    </div>
                </div>

                <h3 style="font-size: 1rem; margin-top:20px;">Runas</h3>
                <div class="menu_runas" id="lista-runas"></div>
            </div>
        </div>

        <!-- ÁREA DIREITA: TIME VERMELHO -->
        <div class="time-coluna time-vermelho">
            <h3>Time Vermelho</h3>
            <div class="lista-bans" id="bans-vermelho" style="justify-content: flex-end;"></div>
            <div id="jogadores-vermelho"></div>
            <div class="espectador-box" id="box-espectador" style="display:none;">
                <h4 style="color:#666;">Espectador</h4>
                <p id="nome-espectador">-</p>
            </div>
        </div>
    </div>

    <!-- Módulo JS -->
    <script type="module">
        // 1. IMPORTANDO CONFIGURAÇÃO DO FIREBASE
        // É essencial que o arquivo backend/firebase-config.js exporte 'db' e 'auth' corretamente.
        import { db } from '../backend/firebase-config.js';
        import { ref, onValue, set, update, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // ID Simulado do Usuário Logado (Pegue do seu Auth system ou LocalStorage na prática)
        const meuUID = localStorage.getItem('userUID') || 'uid_' + Math.floor(Math.random() * 1000);
        const meuNome = localStorage.getItem('userName') || 'Jogador ' + meuUID.slice(-3);
        const idSala = localStorage.getItem('salaAtual') || 'sala_global_1';

        // 2. BANCO DE DADOS LOCAL (Campeões e Runas)
        const dadosCampeoes = {
            litlegot: {
                id: "litlegot", nome: "Litlegot", classe: "Mago", icone: "icones/personagens/litlegot.jpeg", 
                lore: "Não me culpe pelos seus erros, é seu dever enfrentá-los.",
                atributos: { ad: 45, ap: 15, df: 25, dm: 30, vm: 520, vda: "0.625", vdm: "330", ah: "0" },
                skills: {
                    p: { nome: "Gênesis", desc: "Permite aliados comprarem fora da base.", img: "icones/habilidades/litlegot/passiva.png" },
                    q: { nome: "Ódio", desc: "Dano contínuo por 4s (10% vida máxima).", img: "icones/habilidades/litlegot/1_hab.jpg" },
                    w: { nome: "Empatia", desc: "Cura, escudo e lentidão.", img: "icones/habilidades/litlegot/2_hab.jpg" },
                    e: { nome: "Felicidade", desc: "Cega, enraiza e dá visão.", img: "icones/habilidades/litlegot/3_hab.jpg" },
                    r: { nome: "Paixão", desc: "Muda cores secundárias.", img: "icones/habilidades/litlegot/R_hab.jpg" }
                }
            },
            abrax: {
                id: "abrax", nome: "Abrax", classe: "Lutador / AD", icone: "icones/personagens/abrax.jpeg",
                lore: "Mostre-me o que podes fazer e eu provavelmente farei melhor.",
                atributos: { ad: 65, ap: 0, df: 35, dm: 32, vm: 600, vda: "0.650", vdm: "345", ah: "0" },
                skills: {
                    p: { nome: "A falácia do Apostador", desc: "Vampirismo com base no crítico.", img: "icones/habilidades/abrax/passiva.jpg" },
                    q: { nome: "Mascarada dos Tolos", desc: "Rouba habilidades.", img: "icones/habilidades/abrax/1_hab.jpg" },
                    w: { nome: "Honestamente?", desc: "Dash na direção do cursor.", img: "icones/habilidades/abrax/2_hab.jpg" },
                    e: { nome: "Sobrecarregada", desc: "Empurrão com atordoamento.", img: "icones/habilidades/abrax/3_hab.jpg" },
                    r: { nome: "No limite", desc: "Status absurdos à beira da morte.", img: "icones/habilidades/abrax/r_hab.jpg" }
                }
            },
            psique: {
                id: "psique", nome: "Psique", classe: "Lutador / Mago", icone: "icones/personagens/psique.jpeg",
                lore: "Venha abraçar a liberdade que só eu posso lhe dar",
                atributos: { ad: 55, ap: 10, df: 30, dm: 30, vm: 580, vda: "0.635", vdm: "340", ah: "0" },
                skills: {
                    p: { nome: "Parasita Espiritual", desc: "Rouba atributos ao acertar skills.", img: "icones/habilidades/psique/passiva.jpg" },
                    q: { nome: "Marca Vital", desc: "Ataques curam baseados em crítico.", img: "icones/habilidades/psique/1_hab.jpg" },
                    w: { nome: "Passo Fantasma", desc: "Invisibilidade e dash.", img: "icones/habilidades/psique/2_hab.jpg" },
                    e: { nome: "Enxame de Memórias", desc: "Coleta últimas habilidades usadas.", img: "icones/habilidades/psique/3_hab.jpg" },
                    r: { nome: "Domínio Sombrio", desc: "Área de cura e dano contínuo.", img: "icones/habilidades/psique/r_hab.jpg" }
                }
            }
        };

        const dadosRunas = [
            { id: "runa1", nome: "Até o Último Suspiro", desc: "Vida máx. em risco.", icone: "icones/runas/ultimo_suspiro.jpg" },
            { id: "runa2", nome: "Desejo de Guerra", desc: "Defesa com base no AD.", icone: "icones/runas/desejo_guerra.jpg" },
            { id: "runa3", nome: "Gimmi", desc: "Itens baratos, cobra juros.", icone: "icones/runas/gimmi.jpg" }
        ];

        // 3. VARIÁVEIS DE ESTADO DO CLIENTE
        let campeaoSelecionado = null;
        let runaSelecionada = null;
        let faseAtualLocal = "";
        let minhaEquipe = null;
        let souEspectador = false;

        // Tornar função global para o HTML chamar
        window.mostrarSkill = function(tecla) {
            if(!campeaoSelecionado) return;
            const skill = campeaoSelecionado.skills[tecla];
            document.getElementById('descricao-skill').innerHTML = `<strong style="color:#c8aa6e;">[${tecla.toUpperCase()}] ${skill.nome}</strong> - ${skill.desc}`;
        };

        // 4. RENDERIZANDO INTERFACE BASE
        function renderizarBase() {
            // Renderiza Campeões
            const listaDiv = document.getElementById('lista-campeoes');
            for (const key in dadosCampeoes) {
                const c = dadosCampeoes[key];
                const div = document.createElement('div');
                div.className = 'campeao-icone';
                div.id = `camp-${key}`;
                div.style.backgroundImage = `url('${c.icone}')`;
                div.innerHTML = `<span>${c.nome}</span>`;
                div.onclick = () => clicarCampeao(key, div);
                listaDiv.appendChild(div);
            }
            // Renderiza Runas
            const runasDiv = document.getElementById('lista-runas');
            dadosRunas.forEach(r => {
                const div = document.createElement('div');
                div.className = 'runa';
                div.innerHTML = `<div class="runa-icone" style="background-image: url('${r.icone}')"></div><div style="font-size:0.7rem;">${r.nome}</div>`;
                div.onclick = () => {
                    if (faseAtualLocal === 'selecao') {
                        runaSelecionada = r.id;
                        document.querySelectorAll('.runa').forEach(el => el.classList.remove('ativa'));
                        div.classList.add('ativa');
                        verificarConfirmacao();
                    }
                };
                runasDiv.appendChild(div);
            });
        }

        // Interação de Clique no Campeão
        function clicarCampeao(key, divEl) {
            if (faseAtualLocal !== 'banimento' && faseAtualLocal !== 'selecao') return;
            if (divEl.classList.contains('banido')) return;

            campeaoSelecionado = dadosCampeoes[key];
            document.querySelectorAll('.campeao-icone').forEach(el => el.classList.remove('ativo'));
            divEl.classList.add('ativo');
            
            document.getElementById('painel-detalhes').style.display = 'block';
            document.getElementById('nome-campeao').innerText = campeaoSelecionado.nome;
            document.getElementById('classe-campeao').innerText = campeaoSelecionado.classe;
            document.getElementById('lore-campeao').innerText = campeaoSelecionado.lore;
            
            ['ad','ap','df','dm','vm','vda','vdm','ah'].forEach(attr => {
                document.getElementById(`attr-${attr}`).innerText = campeaoSelecionado.atributos[attr];
            });

            ['p','q','w','e','r'].forEach(t => {
                const btn = document.getElementById(`icone-${t}`);
                btn.style.backgroundImage = `url('${campeaoSelecionado.skills[t].img}')`;
                btn.innerText = "";
            });
            verificarConfirmacao();
        }

        // Verifica se o botão Confirmar deve ser habilitado
        function verificarConfirmacao() {
            const btn = document.getElementById('btn-confirmar');
            const rota = document.getElementById('select-rota').value;
            
            if (faseAtualLocal === 'banimento') {
                btn.innerText = "Confirmar Banimento";
                btn.disabled = !campeaoSelecionado;
            } else if (faseAtualLocal === 'selecao') {
                btn.innerText = "Confirmar Escolha";
                btn.disabled = !(campeaoSelecionado && runaSelecionada && rota !== "");
            } else {
                btn.disabled = true;
            }
        }

        document.getElementById('select-rota').addEventListener('change', verificarConfirmacao);

        // 5. LÓGICA DE SERVIDOR (Sincronizando com Firebase)
        const salaRef = ref(db, 'salas/' + idSala);

        // Divisão Inicial Justa (Somente o Host/Primeiro player a entrar processa isso)
        async function verificarDivisao() {
            const snapshot = await get(salaRef);
            if (!snapshot.exists() || snapshot.val().fase === 'lobby') {
                // Simulação: Pegando os players do "Lobby"
                // No seu código real, você buscaria do nó "Lobby" do firebase
                const mockPlayers = [
                    { uid: meuUID, nome: meuNome },
                    { uid: 'uid_1', nome: 'Jogador 1' },
                    { uid: 'uid_2', nome: 'Jogador 2' },
                    // { uid: 'uid_3', nome: 'Jogador 3' } // Impar = espectador
                ];

                // Mistura e Divide
                const embaralhados = mockPlayers.sort(() => 0.5 - Math.random());
                let espectador = null;
                if (embaralhados.length % 2 !== 0) {
                    espectador = embaralhados.pop();
                }
                const meio = Math.floor(embaralhados.length / 2);
                
                let estruturaJogadores = {};
                embaralhados.slice(0, meio).forEach(p => {
                    estruturaJogadores[p.uid] = { nome: p.nome, equipe: 'azul', campeao: '', rota: '', status: 'aguardando' };
                });
                embaralhados.slice(meio).forEach(p => {
                    estruturaJogadores[p.uid] = { nome: p.nome, equipe: 'vermelha', campeao: '', rota: '', status: 'aguardando' };
                });

                await set(salaRef, {
                    fase: 'banimento',
                    tempoRESTANTE: 30, // 30s para bans
                    jogadores: estruturaJogadores,
                    bans: { azul: "", vermelha: "" },
                    espectador: espectador ? espectador.uid : null,
                    host: meuUID
                });
                iniciarTimerServidor();
            }
        }

        // Gerenciador de Tempo (Apenas o Host executa para evitar dessincronização)
        let timerInterval;
        function iniciarTimerServidor() {
            timerInterval = setInterval(async () => {
                const snap = await get(salaRef);
                let dados = snap.val();
                if (dados.host !== meuUID) return; // Só o host diminui o tempo

                if (dados.tempoRESTANTE > 0) {
                    update(salaRef, { tempoRESTANTE: dados.tempoRESTANTE - 1 });
                } else {
                    // Transição de Fases
                    if (dados.fase === 'banimento') {
                        update(salaRef, { fase: 'selecao', tempoRESTANTE: 60 }); // 60s pra pick
                    } else if (dados.fase === 'selecao') {
                        update(salaRef, { fase: 'carregando', tempoRESTANTE: 0 });
                        clearInterval(timerInterval);
                    }
                }
            }, 1000);
        }

        // Ouvinte em Tempo Real do Firebase
        onValue(salaRef, (snapshot) => {
            const dados = snapshot.val();
            if (!dados) return;

            faseAtualLocal = dados.fase;
            document.getElementById('tempo-restante').innerText = dados.tempoRESTANTE;

            // Determinar o papel do jogador local
            if (dados.espectador === meuUID) {
                souEspectador = true;
                document.getElementById('select-rota').disabled = true;
                document.getElementById('btn-confirmar').style.display = 'none';
            } else if (dados.jogadores[meUID]) {
                minhaEquipe = dados.jogadores[meuUID].equipe;
            }

            // Atualiza Top Bar
            const statusFase = document.getElementById('status-fase');
            if (faseAtualLocal === 'banimento') statusFase.innerText = "Fase de Banimentos";
            else if (faseAtualLocal === 'selecao') statusFase.innerText = "Escolha seu Campeão";
            else if (faseAtualLocal === 'carregando') {
                statusFase.innerText = "Iniciando Partida...";
                setTimeout(() => { window.location.href = "../partida/loading.html"; }, 2000);
            }

            // Atualiza Listas de Times e UI Visual
            renderizarJogadores(dados);
            processarBansEBloqueios(dados);
            verificarConfirmacao();
        });

        function renderizarJogadores(dados) {
            const containerAzul = document.getElementById('jogadores-azul');
            const containerVermelho = document.getElementById('jogadores-vermelho');
            containerAzul.innerHTML = ''; containerVermelho.innerHTML = '';

            for (const uid in dados.jogadores) {
                const j = dados.jogadores[uid];
                const div = document.createElement('div');
                div.className = 'jogador-card';
                
                const miniatura = j.campeao ? `style="background-image: url('${dadosCampeoes[j.campeao].icone}')"` : '';
                
                div.innerHTML = `
                    <div class="jogador-nome">${uid === meuUID ? `> ${j.nome}` : j.nome}</div>
                    <div class="jogador-funcao">${j.rota || 'Escolhendo Rota...'}</div>
                    <div class="jogador-status">${j.status}</div>
                    <div class="campeao-mini" ${miniatura}></div>
                `;

                if (j.equipe === 'azul') containerAzul.appendChild(div);
                else containerVermelho.appendChild(div);
            }

            // Espectador
            if (dados.espectador) {
                document.getElementById('box-espectador').style.display = 'block';
                // Assumindo que o ID do espectador seja renderizado como nome por simplificação
                document.getElementById('nome-espectador').innerText = dados.espectador === meuUID ? "(Você)" : "Assistindo";
            }
        }

        function processarBansEBloqueios(dados) {
            // Reseta bloqueios visuais
            document.querySelectorAll('.campeao-icone').forEach(el => el.classList.remove('banido'));

            // Mostra bans nos slots
            ['azul', 'vermelha'].forEach(eq => {
                const containerId = eq === 'azul' ? 'bans-azul' : 'bans-vermelho';
                const ban = dados.bans[eq];
                document.getElementById(containerId).innerHTML = ban 
                    ? `<div class="ban-slot" style="background-image: url('${dadosCampeoes[ban].icone}')" title="Banido pelo time ${eq}"></div>`
                    : `<div class="ban-slot"></div>`;

                if (ban) {
                    const iconeBanido = document.getElementById(`camp-${ban}`);
                    if (iconeBanido) iconeBanido.classList.add('banido');
                }
            });

            // Bloqueia seleções já feitas (Picks únicos)
            for (const uid in dados.jogadores) {
                const c = dados.jogadores[uid].campeao;
                if (c && dados.jogadores[uid].status === 'confirmado') {
                    const icone = document.getElementById(`camp-${c}`);
                    if(icone) {
                        icone.classList.add('banido'); // Usa a classe banido para bloquear visualmente
                        icone.style.borderColor = dados.jogadores[uid].equipe === 'azul' ? '#005a82' : '#820000';
                    }
                }
            }
        }

        // 6. AÇÃO DO BOTÃO PRINCIPAL (Banir ou Pickar)
        document.getElementById('btn-confirmar').onclick = () => {
            if (souEspectador || !campeaoSelecionado) return;

            if (faseAtualLocal === 'banimento') {
                // Registrar Ban no time correspondente
                const updates = {};
                updates[`bans/${minhaEquipe}`] = campeaoSelecionado.id;
                update(salaRef, updates);
                
                // Limpar seleção local
                campeaoSelecionado = null;
                document.getElementById('btn-confirmar').disabled = true;

            } else if (faseAtualLocal === 'selecao') {
                // Registrar Escolha e Rota do Jogador
                const rotaEscolhida = document.getElementById('select-rota').value;
                const updates = {};
                updates[`jogadores/${meuUID}/campeao`] = campeaoSelecionado.id;
                updates[`jogadores/${meuUID}/runa`] = runaSelecionada;
                updates[`jogadores/${meuUID}/rota`] = rotaEscolhida;
                updates[`jogadores/${meuUID}/status`] = "confirmado";
                update(salaRef, updates);

                // Bloqueia UI pro jogador
                document.getElementById('btn-confirmar').disabled = true;
                document.getElementById('btn-confirmar').innerText = "Aguardando outros...";
                document.getElementById('select-rota').disabled = true;
            }
        };

        // Inicialização
        window.onload = () => {
            renderizarBase();
            verificarDivisao(); // Tenta configurar a sala se for o primeiro a entrar
        };
    </script>
</body>
</html>
