<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Client - Hextech Edition</title>
    <style>
        /* =========================================
           TEMA HEXTECH, MOUSE & ANIMAÇÕES
           ========================================= */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Roboto:wght@300;400;500;700&display=swap');

        :root {
            --gold: #C8AA6E;
            --gold-light: #F0E6D2;
            --gold-dark: #7A5C29;
            --blue-light: #0AC8B9;
            --blue-magic: #005A82;
            --blue-dark: #0A1428;
            --bg-dark: #010A13;
            --border-hextech: #463714;
            --border-active: #C8AA6E;
            --panel-bg: rgba(1, 10, 19, 0.88);
        }

        /* Cursor Customizado Hextech estilo LoL */
        * {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="%23C8AA6E" stroke="%23010A13" stroke-width="1.5" d="M3 3l7 18 3-7 7-3L3 3z"/></svg>'), auto !important;
        }

        button, input, .clickable {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="%230AC8B9" stroke="%23F0E6D2" stroke-width="1.5" d="M3 3l7 18 3-7 7-3L3 3z"/></svg>'), pointer !important;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px var(--gold-dark); }
            50% { box-shadow: 0 0 18px var(--gold), inset 0 0 10px var(--gold-dark); }
            100% { box-shadow: 0 0 5px var(--gold-dark); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bgFloat {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #0a1428 0%, #010a13 100%);
            background-size: 200% 200%;
            animation: bgFloat 25s ease infinite;
            font-family: 'Roboto', sans-serif; color: var(--gold-light);
            overflow: hidden;
            user-select: none;
        }

        /* --- TELA DE LOGIN --- */
        #login-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 200; background: rgba(1, 10, 19, 0.96);
            backdrop-filter: blur(8px); transition: opacity 0.5s ease;
        }

        .login-box {
            background: linear-gradient(135deg, rgba(10,20,40,0.95) 0%, rgba(1,10,19,0.95) 100%);
            border: 2px solid var(--gold-dark); padding: 45px; width: 340px;
            text-align: center; position: relative;
            animation: pulseGlow 4s infinite;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .login-box h1 {
            font-family: 'Cinzel', serif; color: var(--gold); margin-bottom: 25px;
            font-size: 24px; text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 0 10px var(--gold-dark);
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 11px; color: var(--gold); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .input-group input {
            width: calc(100% - 24px); padding: 11px; background: rgba(0,0,0,0.6);
            border: 1px solid var(--border-hextech); color: var(--gold-light);
            outline: none; transition: 0.3s; font-family: 'Roboto', sans-serif;
        }
        .input-group input:focus { border-color: var(--gold); box-shadow: 0 0 12px var(--gold-dark); background: rgba(10,20,40,0.9); }

        .btn {
            background: linear-gradient(to bottom, #1E2328, #0A1428); border: 1px solid var(--gold);
            color: var(--gold); padding: 12px 20px;
            font-family: 'Cinzel', serif; font-weight: bold; text-transform: uppercase;
            width: 100%; transition: 0.3s; letter-spacing: 1.5px;
        }
        .btn:hover { background: var(--gold); color: var(--bg-dark); box-shadow: 0 0 18px var(--gold); }

        /* --- CLIENTE PRINCIPAL --- */
        #main-client { display: none; width: 100%; height: 100%; flex-direction: column; }

        /* BARRA SUPERIOR (TOPBAR) */
        .topbar {
            height: 65px; background: linear-gradient(to right, rgba(1,10,19,1), rgba(10,20,40,0.95));
            border-bottom: 2px solid var(--gold-dark); display: flex; align-items: center;
            justify-content: space-between; padding: 0 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            z-index: 50;
        }

        .nav-tabs { display: flex; gap: 10px; }
        .nav-tab-btn {
            background: transparent; border: none; color: #888;
            font-family: 'Cinzel', serif; font-size: 15px; font-weight: 700;
            padding: 18px 20px; text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 3px solid transparent; transition: all 0.3s;
        }
        .nav-tab-btn:hover { color: var(--gold-light); }
        .nav-tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); text-shadow: 0 0 10px var(--gold); }

        /* PLAYER DE MÚSICA DE FUNDO */
        .bgm-controls {
            display: flex; align-items: center; gap: 12px;
            background: rgba(0,0,0,0.5); border: 1px solid var(--border-hextech);
            padding: 6px 14px; border-radius: 20px;
        }
        .bgm-title { font-size: 11px; color: var(--gold); font-family: 'Cinzel', serif; letter-spacing: 1px; }
        .bgm-btn {
            background: none; border: 1px solid var(--gold-dark); color: var(--gold);
            width: 28px; height: 28px; border-radius: 50%; font-size: 12px;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .bgm-btn:hover { background: var(--gold); color: #000; }

        /* ÁREA DE CONTEÚDO PRINCIPAL */
        .content-area { flex: 1; height: calc(100% - 65px); position: relative; }
        .view-panel { display: none; width: 100%; height: 100%; }
        .view-panel.active { display: flex; }

        /* =========================================
            TELA 1: SELEÇÃO DE CAMPEÕES & SHOWCASE
           ========================================= */
        .champ-select-layout { display: flex; width: 100%; height: 100%; }

        /* Lista Lateral de Campeões */
        .roster-sidebar {
            width: 320px; background: rgba(1, 10, 19, 0.92); border-right: 2px solid var(--border-hextech);
            padding: 25px 15px; display: flex; flex-direction: column; gap: 15px;
            box-shadow: 5px 0 20px rgba(0,0,0,0.6);
        }
        .roster-header {
            font-family: 'Cinzel', serif; font-size: 14px; color: var(--gold);
            text-transform: uppercase; letter-spacing: 1px; text-align: center;
            border-bottom: 1px solid var(--border-hextech); padding-bottom: 10px;
        }

        .roster-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; overflow-y: auto; padding-right: 5px; }
        .champ-card {
            height: 120px; background-color: #000; border: 2px solid var(--border-hextech);
            position: relative; overflow: hidden; transition: all 0.3s;
            display: flex; align-items: flex-end; justify-content: center;
        }
        .champ-card img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; opacity: 0.7; transition: 0.4s; }
        .champ-card:hover img, .champ-card.selected img { opacity: 1; transform: scale(1.08); }
        .champ-card:hover { border-color: var(--gold-light); transform: translateY(-3px); }
        .champ-card.selected { border-color: var(--gold); animation: pulseGlow 2s infinite; }
        .champ-card-name {
            position: relative; z-index: 2; width: 100%; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            text-align: center; font-family: 'Cinzel', serif; font-size: 12px; color: var(--gold-light);
            padding: 6px 0; font-weight: bold;
        }

        /* SHOWCASE DO CAMPEÃO (ESTILO LOL PC) */
        .champ-showcase {
            flex: 1; display: flex; flex-direction: column; position: relative;
            background: radial-gradient(circle at 70% 30%, rgba(10,20,40,0.7) 0%, rgba(1,10,19,0.95) 100%);
            padding: 40px; overflow-y: auto;
        }

        .showcase-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border-hextech); padding-bottom: 20px; }
        .champ-identity { display: flex; flex-direction: column; }
        .champ-title-badge { font-family: 'Cinzel', serif; font-size: 13px; color: var(--blue-light); text-transform: uppercase; letter-spacing: 2px; }
        .champ-main-name { font-family: 'Cinzel', serif; font-size: 46px; color: var(--gold); text-transform: uppercase; margin: 5px 0; text-shadow: 0 0 20px rgba(200, 170, 110, 0.4); }
        .champ-quote-box { font-style: italic; color: #A09B8C; font-size: 14px; border-left: 3px solid var(--gold); padding-left: 12px; margin-top: 5px; }

        /* BARRAS DE ATRIBUTOS DO PERSONAGEM */
        .stats-container { display: flex; gap: 20px; background: rgba(0,0,0,0.4); padding: 15px 20px; border: 1px solid var(--border-hextech); }
        .stat-item { display: flex; flex-direction: column; gap: 4px; width: 90px; }
        .stat-label { font-size: 10px; font-family: 'Cinzel', serif; color: var(--gold); text-transform: uppercase; }
        .stat-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: var(--blue-light); width: 0%; transition: width 0.8s ease; }

        /* SEÇÃO DE HABILIDADES */
        .abilities-section { margin-top: 30px; display: flex; flex-direction: column; gap: 15px; }
        .section-title { font-family: 'Cinzel', serif; color: var(--gold); font-size: 18px; letter-spacing: 1px; border-bottom: 1px solid rgba(200,170,110,0.2); padding-bottom: 8px; }

        .ability-card {
            display: flex; gap: 20px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-hextech);
            padding: 18px; transition: 0.3s; animation: fadeIn 0.4s ease backwards;
        }
        .ability-card:hover { border-color: var(--gold); background: rgba(10,20,40,0.6); }

        .ability-icon-wrapper {
            width: 60px; height: 60px; border: 1px solid var(--gold); background: #000;
            position: relative; flex-shrink: 0;
        }
        .ability-icon-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .ability-key {
            position: absolute; bottom: -6px; right: -6px; background: var(--bg-dark);
            border: 1px solid var(--gold); color: var(--gold); font-family: 'Cinzel', serif;
            font-size: 11px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-weight: bold;
        }

        .ability-details { flex: 1; }
        .ability-title { font-family: 'Cinzel', serif; color: var(--gold-light); font-size: 16px; font-weight: bold; margin-bottom: 6px; }
        .ability-description { color: #B0A890; font-size: 13px; line-height: 1.5; }

        /* PALETA DA HABILIDADE GÊNESIS (LITLEGOT) */
        .genesis-container { margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--border-hextech); }
        .genesis-palette-tabs { display: flex; gap: 10px; margin-bottom: 12px; }
        .palette-btn {
            padding: 6px 12px; border: 1px solid var(--border-hextech); background: rgba(0,0,0,0.6);
            color: var(--gold-light); font-size: 11px; font-family: 'Cinzel', serif;
        }
        .palette-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(200,170,110,0.1); }

        /* =========================================
            TELA 2: CHAT DO LÓBI (SEPARADO)
           ========================================= */
        .chat-view-layout { display: flex; width: 100%; height: 100%; background: rgba(1, 10, 19, 0.95); }

        .chat-rooms-sidebar {
            width: 260px; border-right: 1px solid var(--border-hextech); background: rgba(0,0,0,0.4);
            padding: 20px; display: flex; flex-direction: column; gap: 10px;
        }
        .room-select-btn {
            background: transparent; border: 1px solid var(--border-hextech); color: var(--gold-light);
            padding: 12px 15px; text-align: left; font-family: 'Cinzel', serif; font-size: 13px;
            transition: 0.3s;
        }
        .room-select-btn:hover { border-color: var(--gold); color: var(--gold); }
        .room-select-btn.active { background: rgba(200,170,110,0.15); border-color: var(--gold); color: var(--gold); }

        .chat-main-panel { flex: 1; display: flex; flex-direction: column; }
        .chat-header-bar {
            padding: 20px 30px; border-bottom: 1px solid var(--border-hextech);
            font-family: 'Cinzel', serif; color: var(--gold); font-size: 18px; letter-spacing: 1px;
        }
        .chat-feed { flex: 1; padding: 25px 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .chat-msg {
            background: rgba(255,255,255,0.02); padding: 10px 15px; border-radius: 4px;
            border-left: 3px solid var(--blue-magic); font-size: 14px; animation: fadeIn 0.3s ease;
        }
        .chat-msg.sys { border-left-color: var(--gold-dark); color: var(--gold-dark); font-style: italic; }
        .chat-msg-user { font-weight: bold; color: var(--gold); font-family: 'Cinzel', serif; margin-right: 6px; }
        .chat-msg-champ { font-size: 11px; color: var(--blue-light); margin-right: 10px; }
        .chat-msg-text { color: var(--gold-light); }

        .chat-input-bar { display: flex; padding: 20px 30px; gap: 15px; background: rgba(0,0,0,0.6); border-top: 1px solid var(--border-hextech); }
        .chat-input-bar input {
            flex: 1; background: rgba(10,20,40,0.8); border: 1px solid var(--border-hextech);
            color: #FFF; padding: 12px 18px; outline: none; transition: 0.3s;
        }
        .chat-input-bar input:focus { border-color: var(--gold); box-shadow: 0 0 10px var(--gold-dark); }

        /* MINICHAT RETRÁTIL NA TELA DE SELEÇÃO */
        .mini-chat-toggle {
            position: absolute; bottom: 20px; right: 20px; z-index: 100;
            background: var(--blue-dark); border: 1px solid var(--gold); color: var(--gold);
            padding: 10px 18px; font-family: 'Cinzel', serif; font-size: 12px; font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- AUDIO BGM DA INTERFACE -->
    <audio id="bgm-player" loop preload="auto">
        <!-- Áudio ambiente Hextech LoL Style em loop continuado -->
        <source src="https://assets.mixkit.co/music/preview/mixkit-game-level-music-689.mp3" type="audio/mpeg">
    </audio>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h1>Summoner's Rift</h1>
            <div class="input-group">
                <label>Nome de Invocador</label>
                <input type="text" id="username" placeholder="Digite seu nome..." autocomplete="off">
            </div>
            <div class="input-group">
                <label>Senha Hextech</label>
                <input type="password" id="password" placeholder="********">
            </div>
            <button class="btn clickable" onclick="fazerLogin()">Conectar</button>
        </div>
    </div>

    <!-- CLIENTE PRINCIPAL -->
    <div id="main-client">
        
        <!-- BARRA SUPERIOR -->
        <div class="topbar">
            <div class="nav-tabs">
                <button class="nav-tab-btn active clickable" onclick="mudarAba('selecao', this)">⚔️ Seleção de Campeões</button>
                <button class="nav-tab-btn clickable" onclick="mudarAba('chat', this)">💬 Chat do Lóbi</button>
            </div>

            <!-- PLAYER BGM COM CONTROLE -->
            <div class="bgm-controls">
                <span class="bgm-title">Música Hextech</span>
                <button class="bgm-btn clickable" id="bgm-toggle-btn" onclick="toggleBGM()">⏸</button>
            </div>
        </div>

        <div class="content-area">
            
            <!-- =========================================
                 ABA 1: SELEÇÃO DE CAMPEÕES & VISUALIZADOR
                 ========================================= -->
            <div id="view-selecao" class="view-panel active">
                <div class="champ-select-layout">
                    
                    <!-- ROSTER LATERAL -->
                    <div class="roster-sidebar">
                        <div class="roster-header">Campeões Disponíveis</div>
                        <div class="roster-grid" id="roster-grid">
                            <!-- Injetado via JS -->
                        </div>
                    </div>

                    <!-- SHOWCASE DO CAMPEÃO SELECIONADO -->
                    <div class="champ-showcase" id="champ-showcase">
                        <div class="showcase-header">
                            <div class="champ-identity">
                                <span class="champ-title-badge" id="c-title">Título do Campeão</span>
                                <h1 class="champ-main-name" id="c-name">Nome do Campeão</h1>
                                <div class="champ-quote-box" id="c-quote">"Frase marcante do campeão."</div>
                            </div>

                            <!-- ATRIBUTOS DO PERSONAGEM (ESTILO LOL PC) -->
                            <div class="stats-container">
                                <div class="stat-item">
                                    <span class="stat-label">Dano</span>
                                    <div class="stat-bar-bg"><div class="stat-bar-fill" id="st-dano"></div></div>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">Resistência</span>
                                    <div class="stat-bar-bg"><div class="stat-bar-fill" id="st-defensa"></div></div>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">Magia</span>
                                    <div class="stat-bar-bg"><div class="stat-bar-fill" id="st-magia"></div></div>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">Dificuldade</span>
                                    <div class="stat-bar-bg"><div class="stat-bar-fill" id="st-dificuldade"></div></div>
                                </div>
                            </div>
                        </div>

                        <!-- LISTA DE HABILIDADES -->
                        <div class="abilities-section">
                            <div class="section-title">Habilidades do Campeão</div>
                            <div id="abilities-list" style="display: flex; flex-direction: column; gap: 15px;">
                                <!-- Injetado via JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- =========================================
                 ABA 2: CHAT DO LÓBI (SEPARADO)
                 ========================================= -->
            <div id="view-chat" class="view-panel">
                <div class="chat-view-layout">
                    <div class="chat-rooms-sidebar">
                        <div class="roster-header" style="margin-bottom: 10px;">Salas do Chat</div>
                        <button class="room-select-btn active clickable" onclick="mudarSala('Geral', this)"># Geral</button>
                        <button class="room-select-btn clickable" onclick="mudarSala('Taverna do Poro', this)"># Taverna do Poro</button>
                        <button class="room-select-btn clickable" onclick="mudarSala('Busca de Grupo', this)"># Busca de Grupo</button>
                    </div>

                    <div class="chat-main-panel">
                        <div class="chat-header-bar" id="chat-title-display">SALA: Geral</div>
                        <div class="chat-feed" id="chat-feed-box">
                            <div class="chat-msg sys">Conectando ao canal mágico de comunicação...</div>
                        </div>
                        <div class="chat-input-bar">
                            <input type="text" id="chat-input-field" placeholder="Digite sua mensagem para a sala..." onkeypress="if(event.key === 'Enter') enviarMensagem()">
                            <button class="btn clickable" style="width: 140px;" onclick="enviarMensagem()">Enviar</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ==========================================
        // EFEITOS SONOROS SINTETIZADOS (WEB AUDIO API)
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'hover') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(330, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            }
        }

        // Adiciona listeners para os efeitos sonoros do mouse
        document.addEventListener('mouseover', (e) => {
            if (e.target.closest('.clickable, button, input, .champ-card')) {
                playSound('hover');
            }
        });

        document.addEventListener('click', (e) => {
            if (e.target.closest('.clickable, button, input, .champ-card')) {
                playSound('click');
            }
        });

        // ==========================================
        // DADOS DOS CAMPEÕES
        // ==========================================
        const campeoes = {
            litlegot: {
                id: 'litlegot', name: 'Litlegot', title: 'O Mago das Tintas',
                quote: 'Não me culpe pelos erros, é seu dever corrigi-los.',
                icon: 'personagens/litlegot.jpeg',
                stats: { dano: 50, defensa: 30, magia: 95, dificuldade: 85 },
                abilities: [
                    { key: 'P', name: 'Aspiriração', desc: 'Permite aos aliados comprar itens fora da base desenhando mercadores estáticos pelo mapa.', icon: 'habilidades/litlegot/passiva.jpg' },
                    { key: 'Q', name: 'Ódio', desc: 'Desenha fogo puro no mapa causando dano contínuo por 4s equivalente a 10% da vida máxima.', icon: 'habilidades/litlegot/1_hab.jpg' },
                    { key: 'W', name: 'Empatia', desc: 'Desenha água calmante concedendo cura e escudo a aliados e lentidão a inimigos.', icon: 'habilidades/litlegot/2_hab.jpg' },
                    { key: 'E', name: 'Felicidade', desc: 'Pinta clarões de luz que cegam e enraízam inimigos no chão.', icon: 'habilidades/litlegot/3_hab.jpg' },
                    { key: 'R', name: 'Gênesis', desc: 'Mistura as últimas tintas para alterar permanentemente as skills Q, W e E para uma cor secundária.', icon: 'habilidades/litlegot/R_hab.jpg',
                      isUltimate: true,
                      genesis: {

            psique: {
                id: 'psique', name: 'Psique', title: 'Lutador Espiritual',
                quote: 'Venha desfrutar da liberdade que lhes tenho a oferecer.',
                icon: 'personagens/psique.jpeg',
                stats: { dano: 80, defensa: 75, magia: 40, dificuldade: 60 },
                abilities: [
                    { key: 'P', name: 'O Prazer dos Mortos', desc: 'Rouba atributos base, vida e mana permanentemente de alvos atingidos.', icon: 'habilidades/psique/passiva.jpg' },
                    { key: 'Q', name: 'Hora de Comer', desc: 'Causa dano extra explosivo e se cura proporcionalmente ao dano crítico.', icon: 'habilidades/psique/1_hab.jpg' },
                    { key: 'W', name: 'Véu do Além', desc: 'Avanço com invisibilidade completa até o próximo ataque.', icon: 'habilidades/psique/2_hab.jpg' },
                    { key: 'E', name: 'Borboletas Espirituais', desc: 'Coleta últimas habilidades de heróis para usar em si ou repassar a um aliado.', icon: 'habilidades/psique/3_hab.jpg' },

        // ==========================================
        // BANCO DE DADOS FIREBASE (SALA DE CHAT)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBykDF5TNKQHejUJTp-ue7s5CKfpJp1HV0",
            authDomain: "mestre-471a0.firebaseapp.com",
            databaseURL: "https://mestre-471a0-default-rtdb.firebaseio.com",
            projectId: "mestre-471a0",
            storageBucket: "mestre-471a0.firebasestorage.app",
            messagingSenderId: "142996111628",
            appId: "1:142996111628:web:c3785e54588632f468c929"
        };

        let db = null;
        let currentUser = "";
        let currentRoom = "Geral";
        let currentChamp = null;
        let chatRef = null;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch (e) {
            console.warn("Firebase operando em modo offline.");
        }

        // ==========================================
        // LÓGICA DE INTERFACE & NAVEGAÇÃO
        // ==========================================
        function fazerLogin() {
            const user = document.getElementById('username').value.trim();
            if (!user) { alert("Informe o Nome de Invocador!"); return; }
            currentUser = user;

            document.getElementById('login-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-client').style.display = 'flex';
                
                // Iniciar música de fundo
                const bgm = document.getElementById('bgm-player');
                bgm.volume = 0.3;
                bgm.play().catch(() => console.log("Interação requerida para áudio automático."));

                renderRoster();
                selecionarCampeao('litlegot');
                iniciarChat(currentRoom);
            }, 500);
        }

        function toggleBGM() {
            const bgm = document.getElementById('bgm-player');
            const btn = document.getElementById('bgm-toggle-btn');
            if (bgm.paused) {
                bgm.play();
                btn.innerText = '⏸';
            } else {
                bgm.pause();
                btn.innerText = '▶';
            }
        }

        function mudarAba(aba, btn) {
            document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`view-${aba}`).classList.add('active');
        }

        function renderRoster() {
            const grid = document.getElementById('roster-grid');
            grid.innerHTML = '';
            for (const key in campeoes) {
                const c = campeoes[key];
                const card = document.createElement('div');
                card.className = 'champ-card clickable';
                card.id = `card-${c.id}`;
                card.onclick = () => selecionarCampeao(c.id);
                card.innerHTML = `
                    <img src="${c.icon}" onerror="this.style.display='none';">
                    <div class="champ-card-name">${c.name}</div>
                `;
                grid.appendChild(card);
            }
        }

        function selecionarCampeao(id) {
            document.querySelectorAll('.champ-card').forEach(c => c.classList.remove('selected'));
            document.getElementById(`card-${id}`).classList.add('selected');
            currentChamp = campeoes[id];

            // Atualiza Header
            document.getElementById('c-name').innerText = currentChamp.name;
            document.getElementById('c-title').innerText = currentChamp.title;
            document.getElementById('c-quote').innerText = `"${currentChamp.quote}"`;

            // Atualiza Status
            document.getElementById('st-dano').style.width = currentChamp.stats.dano + '%';
            document.getElementById('st-defensa').style.width = currentChamp.stats.defensa + '%';
            document.getElementById('st-magia').style.width = currentChamp.stats.magia + '%';
            document.getElementById('st-dificuldade').style.width = currentChamp.stats.dificuldade + '%';

            // Renderiza Habilidades
            const abList = document.getElementById('abilities-list');
            abList.innerHTML = '';

            currentChamp.abilities.forEach(ab => {
                const card = document.createElement('div');
                card.className = 'ability-card';
                
                let content = `
                    <div class="ability-icon-wrapper">
                        <img src="${ab.icon}" onerror="this.style.display='none';">
                        <div class="ability-key">${ab.key}</div>
                    </div>
                    <div class="ability-details">
                        <div class="ability-title">${ab.name}</div>
                        <div class="ability-description">${ab.desc}</div>
                `;

                if (ab.isUltimate && ab.genesis) {
                    content += `
                        <div class="genesis-container">
                            <div class="genesis-palette-tabs">
                                <button class="palette-btn active clickable" onclick="trocarPaletaGenesis('laranja', this)">Paleta Laranja</button>
                                <button class="palette-btn clickable" onclick="trocarPaletaGenesis('verde', this)">Paleta Verde</button>
                                <button class="palette-btn clickable" onclick="trocarPaletaGenesis('roxo', this)">Paleta Roxa</button>
                            </div>
                            <div id="genesis-skills-display">
                                ${renderGenesisSkills(ab.genesis.laranja)}
                            </div>
                        </div>
                    `;
                }

                content += `</div>`;
                card.innerHTML = content;
                abList.appendChild(card);
            });
        }

        function renderGenesisSkills(skills) {
            return skills.map(s => `
                <div style="font-size:12px; margin-bottom: 6px;">
                    <strong style="color:var(--gold);">[${s.key}] ${s.name}:</strong> 
                    <span style="color:#B0A890;">${s.desc}</span>
                </div>
            `).join('');
        }

        function trocarPaletaGenesis(cor, btn) {
            document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const display = document.getElementById('genesis-skills-display');
            display.innerHTML = renderGenesisSkills(currentChamp.abilities[4].genesis[cor]);
        }

        // ==========================================
        // SISTEMA DE CHAT REATIVO
        // ==========================================
        function mudarSala(nomeSala, btn) {
            document.querySelectorAll('.room-select-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentRoom = nomeSala;
            document.getElementById('chat-title-display').innerText = `SALA: ${nomeSala}`;
            iniciarChat(currentRoom);
        }

        function iniciarChat(sala) {
            const feed = document.getElementById('chat-feed-box');
            feed.innerHTML = '<div class="chat-msg sys">Conectando ao canal Hextech...</div>';

            if (!db) {
                feed.innerHTML = '<div class="chat-msg sys">[Modo Offline] Mensagens visíveis apenas localmente.</div>';
                return;
            }

            if (chatRef) chatRef.off();

            const salaID = sala.replace(/\s+/g, '_').toLowerCase();
            chatRef = db.ref('chats/' + salaID);

            chatRef.limitToLast(40).on('child_added', snapshot => {
                const data = snapshot.val();
                if (data) exibirMensagem(data.user, data.champ, data.text);
            });
        }

        function enviarMensagem() {
            const input = document.getElementById('chat-input-field');
            const text = input.value.trim();
            if (!text) return;

            const champName = currentChamp ? currentChamp.name : 'Invocador';

            if (db && chatRef) {
                chatRef.push({ user: currentUser, champ: champName, text: text });
            } else {
                exibirMensagem(currentUser, champName, text);
            }
            input.value = '';
        }

        function exibirMensagem(user, champ, text) {
            const feed = document.getElementById('chat-feed-box');
            if (feed.children.length === 1 && feed.children[0].classList.contains('sys')) {
                feed.innerHTML = '';
            }

            const msg = document.createElement('div');
            msg.className = 'chat-msg';
            msg.innerHTML = `
                <span class="chat-msg-user">${user}</span>
                <span class="chat-msg-champ">(${champ})</span>
                <span class="chat-msg-text">${sanitize(text)}</span>
            `;
            feed.appendChild(msg);
            feed.scrollTop = feed.scrollHeight;
        }

        function sanitize(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
